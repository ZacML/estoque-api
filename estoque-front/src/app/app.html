<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon"><app-icon name="box" /></span>
      <div>
        <strong>Estoque</strong>
        <div class="brand-sub">Armazém Central</div>
      </div>
    </div>

    <div class="menu-label">MENU</div>
    <nav class="nav">
      @for (item of navItems; track item.path) {
        <a
          class="nav-item"
          [routerLink]="item.path"
          routerLinkActive="active"
        >
          <app-icon [name]="item.icon" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="user">
      <span class="avatar">OP</span>
      <div>
        <strong>Operador</strong>
        <div class="user-role">Armazém</div>
      </div>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
