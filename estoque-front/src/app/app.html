<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon"><app-icon name="box" /></span>
      <div>
        <strong>Estoque</strong>
        <div class="brand-sub">Armazém Central</div>
      </div>
    </div>

    <div class="menu-label">MENU</div>
    <nav class="nav">
      @for (item of navItems; track item.path) {
        <a
          class="nav-item"
          [routerLink]="item.path"
          routerLinkActive="active"
        >
          <app-icon [name]="item.icon" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <button
      class="tema-toggle"
      type="button"
      (click)="theme.alternar()"
      [attr.aria-label]="theme.tema() === 'dark' ? 'Ativar modo claro' : 'Ativar modo escuro'"
      [attr.aria-pressed]="theme.tema() === 'dark'"
    >
      <app-icon [name]="theme.tema() === 'dark' ? 'sun' : 'moon'" />
      <span>{{ theme.tema() === 'dark' ? 'Modo claro' : 'Modo escuro' }}</span>
    </button>

    <div class="user">
      <span class="avatar">OP</span>
      <div>
        <strong>Operador</strong>
        <div class="user-role">Armazém</div>
      </div>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
