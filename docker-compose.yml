services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ControleEstoque
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Suc3ss0@
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./estoque
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ControleEstoque
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Suc3ss0@
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./estoque-front
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  db-data:
